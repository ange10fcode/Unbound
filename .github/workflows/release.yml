name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # =========================
      # Windows x64
      # =========================

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish .\Unbound.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\release\win-x64

          Copy-Item `
            .\release\win-x64\Unbound.exe `
            .\Unbound.exe

          Copy-Item .\LICENSE .\release\win-x64
          Copy-Item .\README.md .\release\win-x64

          Compress-Archive `
            -Path .\release\win-x64\* `
            -DestinationPath .\Unbound-win-x64.zip

      # =========================
      # Windows ARM64
      # =========================

      - name: Publish win-arm64
        shell: pwsh
        run: |
          dotnet publish .\Unbound.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\release\win-arm64

          Copy-Item `
            .\release\win-arm64\Unbound.exe `
            .\Unbound-arm64.exe

          Copy-Item .\LICENSE .\release\win-arm64
          Copy-Item .\README.md .\release\win-arm64

          Compress-Archive `
            -Path .\release\win-arm64\* `
            -DestinationPath .\Unbound-win-arm64.zip
      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            'Unbound.exe',
            'Unbound-arm64.exe',
            'Unbound-win-x64.zip',
            'Unbound-win-arm64.zip'
          )

          $lines = foreach ($file in $files) {
            $hash = (
              Get-FileHash $file -Algorithm SHA256
            ).Hash.ToLowerInvariant()

            "$hash  $file"
          }

          $lines |
            Set-Content `
              -Encoding ascii `
              .\SHA256SUMS.txt


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

          files: |
            Unbound.exe
            Unbound-arm64.exe
            Unbound-win-x64.zip
            Unbound-win-arm64.zip
            SHA256SUMS.txt
